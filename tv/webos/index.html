<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>a2d2 TV</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101014;
        color: #ececf1;
        font-family: system-ui, sans-serif;
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <p>a2d2 TV 를 여는 중…</p>
    <script>
      // hosted 웹앱 껍데기: 실제 앱 번들은 서버(릴레이)가 서빙한다.
      // 배포 위치가 정해지면 아래 주소만 바꾸면 된다. 패키지 앱은 file:// 로
      // 떠서 ES 모듈이 CORS 로 막히므로(리서치 문서 1절) 이 우회가 필수다.
      //
      // 개발 중에는 PC 의 preview 서버 주소를 넣는다 (반드시 빌드 산출물 —
      // dev 서버는 트랜스파일 전 코드라 크롬 68(webOS 5.x)에서 안 뜬다):
      //   예) pnpm build && pnpm preview --host → http://<PC IP>:4173/#relay=…&key=…
      var TV_APP_URL = "https://a2d2.communities.buzz.xyz/tv/";
      // 해시(#relay=…&key=…)를 껍데기 실행 인자로 받았으면 그대로 넘긴다.
      window.location.replace(TV_APP_URL + window.location.hash);
    </script>
  </body>
</html>
