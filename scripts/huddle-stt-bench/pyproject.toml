[project]
name = "huddle-stt-bench"
version = "0.1.0"
description = "한국어 STT 엔진(Google Chirp 3·Qwen3-ASR·SenseVoice) 비교 측정 도구"
requires-python = ">=3.10,<3.14"
dependencies = [
    # 1.13.7 은 조용한 구간에서 헛소리를 내고, 1.13.8 에서 동시 실행 버그가 고쳐졌다.
    "sherpa-onnx>=1.13.8",
    # sherpa-onnx 휠은 onnxruntime 을 이 패키지에 기대는데, uv 가 그 의존성을 놓쳐서 직접 적는다.
    "sherpa-onnx-core>=1.13.8",
    "soundfile>=0.12",
    "numpy>=1.24",
    "requests>=2.31",
    # Chirp 3 (Speech-to-Text v2) 를 ADC·서비스 계정으로 부르는 데 쓴다
    "google-auth>=2.30",
]

[project.scripts]
huddle-stt-bench = "huddle_stt_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["huddle_stt_bench"]
