[package]
name = "buzz-gcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Google Cloud access shared by the huddle recorder and the minutes worker: access tokens and a small Cloud Storage JSON API client"

[features]
# A fake Cloud Storage + metadata server for tests (`buzz_gcp::fake`).
fake = ["dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
bytes = "1"
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
buzz-gcp = { path = ".", features = ["fake"] }
tempfile = "3"
uuid = { workspace = true }
